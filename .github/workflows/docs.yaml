name: Docs gate

# The guide renders with every block executed, docs/examples/ matches the chapters,
# the examples run, and rift finds every public class in the docs. The release
# workflow calls this before publishing; run it by hand on any branch.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Docs gate
        run: make docs-check

      - name: Upload the site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
