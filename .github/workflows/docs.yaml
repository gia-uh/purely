name: Docs gate

# The guide renders with every block executed, docs/examples/ matches the chapters,
# the examples run, and rift finds every public class in the docs. The release
# workflow calls this before publishing; run by hand on main, it also deploys
# the guide to GitHub Pages without a release.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Docs gate
        run: make docs-check

      - name: Upload the site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  pages:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy the guide to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
